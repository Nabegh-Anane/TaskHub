<!-- Navbar -->
<nav class="navbar" id="navbar">
  <div class="container">
    <div class="logo">TaskHub</div>

    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="#who-we-are">Who We Are</a></li>
      <li><a href="#services">Services</a></li>
      <li><a href="#packs">Packs</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </div>
</nav>

<!-- Page Wrapper for sticky footer -->
<div class="page-wrapper">
  <div class="content-wrapper">
    <div class="login-container">
      <h2>Connexion</h2>

      <form (ngSubmit)="login()" #loginForm="ngForm">
        <div class="form-group">
          <label for="email">Adresse e-mail</label>
          <input type="email" [(ngModel)]="email" name="email" required class="form-control" />
        </div>

        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input type="password" [(ngModel)]="password" name="password" required class="form-control" />
        </div>

        <button type="submit" class="btn btn-primary" [disabled]="!loginForm.form.valid">Se connecter</button>
      </form>

      <p *ngIf="error" class="text-danger mt-3">{{ error }}</p>

      <p class="mt-4">
        Vous n'avez pas encore de compte ?
        <a routerLink="/register">Inscrivez-vous</a>
      </p>
    </div>
  </div>

<!-- Footer -->
<footer class="footer">
  <div class="container">
    <div class="footer-links">
      <a href="#faq">FAQ</a>
      <a href="#terms">Terms & Conditions</a>
      <a href="#privacy">Privacy Policy</a>
    </div>

    <div class="footer-social">
      <a href="mailto:contact@taskhub.com" aria-label="Email">
        contact&#64;task-hub.tech
      </a>
      <a href="#" aria-label="Facebook"><i class="bi bi-facebook"></i></a>
      <a href="#" aria-label="Twitter"><i class="bi bi-twitter-x"></i></a>
      <a href="#" aria-label="LinkedIn"><i class="bi bi-linkedin"></i></a>
    </div>

  </div>
</footer>
</div>
