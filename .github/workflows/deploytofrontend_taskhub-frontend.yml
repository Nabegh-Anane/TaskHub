name: Deploy Angular Frontend to Azure

on:
  push:
    branches:
      - deploytofrontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Angular app
        run: npm run build

      - name: Zip built app
        run: |
          cd dist/taskhub-frontend
          zip -r ../../frontend.zip .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: taskhub-frontend
          path: frontend.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: taskhub-frontend

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: taskhub-frontend
          publish-profile: ${{ secrets.AZURE_WEBAPP_FRONTEND_PUBLISH_PROFILE }}
          package: frontend.zip
