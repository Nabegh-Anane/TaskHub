name: Build and deploy JAR app to Azure Web App -- taskhub-backend

on:
  push:
    branches:
      - deploytobackend
  workflow_dispatch:
    inputs:
      manual_branch:
        description: 'Branch to build and deploy'
        required: true
        default: 'deploytobackend'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.manual_branch || github.ref_name }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew clean build --no-daemon

      - name: Copy web.config to output
        run: cp web.config build/libs/

      - name: Zip JAR and web.config
        run: |
          cd build/libs
          zip deploy.zip taskhub-backend.jar web.config

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-zip
          path: build/libs/deploy.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-zip
          path: build/libs

      - name: List downloaded artifacts (debug)
        run: ls -la build/libs

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@4.2.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: build/libs/
          server-dir: site/wwwroot/
          exclude: |
            **/.git*
            **/node_modules/**
