name: Build and deploy JAR app to Azure Web App -- taskhub-backend

on:
  push:
    branches:
      - deploytobackend
  workflow_dispatch:
    inputs:
      manual_branch:
        description: 'Branch to build and deploy'
        required: true
        default: 'deploytobackend'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.manual_branch || github.ref_name }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew clean build --no-daemon

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: build/libs/taskhub-backend.jar

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: java-app
          path: build/libs

      - name: List downloaded artifacts (debug)
        run: ls -la build/libs

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_5192489C10764CA6BADFD72857719333 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8EAC1C821CB649389AE6A360F4F14F85 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4EEE7015E6B04E23BC4E7909DB21C590 }}

      - name: Deploy to Azure Web App (Zip Deploy)
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'taskhub-backend'
          package: 'build/libs/taskhub-backend.jar'
