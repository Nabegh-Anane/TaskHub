name: Deploy TaskHub to Azure App Service

on:
  push:
    branches:
      - deploytobackend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build JAR with Gradle
        run: ./gradlew clean bootJar --no-daemon

      - name: Rename JAR for Azure (only if needed)
        run: |
          JAR_FILE=$(find build/libs -name "*.jar" | grep -v "plain")
          echo "Found jar: $JAR_FILE"
          if [[ "$(basename "$JAR_FILE")" != "taskhub-backend.jar" ]]; then
            cp "$JAR_FILE" build/libs/taskhub-backend.jar
          else
            echo "JAR is already named taskhub-backend.jar"
          fi


      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: taskhub-backend
          path: build/libs/taskhub-backend.jar

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: taskhub-backend

      - name: List downloaded files (debug)
        run: ls -la

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: taskhub-backend
          publish-profile: ${{ secrets.azureWebAppPublishProfile }}
          package: taskhub-backend.jar
