spring.application.name=taskhub-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/TaskHub
spring.datasource.username=TaskHub
spring.datasource.password=0000
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.type=com.zaxxer.hikari.HikariDataSource

spring.jpa.properties.hibernate.default_schema=taskhub
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# LOGGING (optionnel)
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Swagger : SUPPRIME les lignes ci-dessous
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html


jwt.secret=TaCleSecreteTrèsComplexe1234567890
jwt.expirationMs=86400000


server.port=8081
